name: One-time TS fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: repair remaining sidebar TypeScript errors'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sidebar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/layouts/SuperAppSidebar.tsx')
          s = p.read_text()
          s = s.replace("import { useCommandPalette } from '@/components/CommandPalette';", "import { useCommandPalette } from '@/components/CommandPalette';\nimport { useTranslation } from 'react-i18next';")
          s = s.replace("const { open: openCommandPalette } = useCommandPalette();", "const { setOpen: setCommandPaletteOpen } = useCommandPalette();")
          s = s.replace("onClick={() => openCommandPalette()}", "onClick={() => setCommandPaletteOpen(true)}")
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/layouts/SuperAppSidebar.tsx
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "fix: repair remaining sidebar TypeScript errors"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/one-time-ts-fix.yml || true
          git commit -m "chore: remove one-time TypeScript fix workflow" || true
          git push || true
