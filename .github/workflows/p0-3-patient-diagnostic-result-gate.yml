name: P0-3 patient diagnostic result gate
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate unconfirmed diagnostic AI results from patient portal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dentvision-backend/src/modules/patient-portal/patientPortal.service.ts')
          s = p.read_text()
          old = """export async function getDiagnostics(patientId: string) {\n  return (prisma as any).referral.findMany({\n    where: { patientId },\n    select: {\n      id: true, studyType: true, category: true, status: true,\n      cost: true, paid: true, createdAt: true,\n      center: { select: { id: true, name: true } },\n      lab: { select: { id: true, name: true } },\n      result: { select: { reportText: true, conclusion: true, createdAt: true } },\n    },\n    orderBy: { createdAt: 'desc' },\n    take: 30,\n  });\n}\n"""
          new = """export async function getDiagnostics(patientId: string) {\n  const referrals = await (prisma as any).referral.findMany({\n    where: { patientId },\n    select: {\n      id: true, studyType: true, category: true, status: true,\n      cost: true, paid: true, createdAt: true,\n      center: { select: { id: true, name: true } },\n      lab: { select: { id: true, name: true } },\n      result: { select: { doctorConfirmed: true, reportText: true, conclusion: true, createdAt: true } },\n    },\n    orderBy: { createdAt: 'desc' },\n    take: 30,\n  });\n\n  // AI diagnostic output is clinical decision support, not a patient-facing\n  // result. Until a clinician confirms it, expose the referral/status only and\n  // never leak the draft report or conclusion into the patient record.\n  return referrals.map((referral: any) => ({\n    ...referral,\n    result: referral.result?.doctorConfirmed\n      ? {\n          reportText: referral.result.reportText,\n          conclusion: referral.result.conclusion,\n          createdAt: referral.result.createdAt,\n        }\n      : null,\n    resultPendingConfirmation: Boolean(referral.result && !referral.result.doctorConfirmed),\n  }));\n}\n"""
          if old not in s:
              raise SystemExit('P0-3 target block not found; refusing to patch')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify patch shape
        run: |
          grep -q "doctorConfirmed: true" dentvision-backend/src/modules/patient-portal/patientPortal.service.ts
          grep -q "resultPendingConfirmation" dentvision-backend/src/modules/patient-portal/patientPortal.service.ts
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dentvision-backend/src/modules/patient-portal/patientPortal.service.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: hide unconfirmed diagnostic AI results from patient portal"
          git push
