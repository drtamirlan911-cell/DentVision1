name: P0-2 final guard
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  guard:
    if: contains(github.event.head_commit.message, 'checkpoint P0-2-final')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('dentvision-backend/src/modules/patient-portal/patientPortal.service.ts')
          s=p.read_text()
          old="""  if (!patient) throw new PortalActionError('Карта пациента не найдена', 'NOT_FOUND');\n  if (!clinic) throw new PortalActionError('Клиника не найдена', 'NOT_FOUND');\n\n  const settings = mergeClinicSettings(clinic.settings);"""
          new="""  if (!patient) throw new PortalActionError('Карта пациента не найдена', 'NOT_FOUND');\n  if (!clinic) throw new PortalActionError('Клиника не найдена', 'NOT_FOUND');\n  if (patient.clinicId !== input.clinicId) {\n    throw new PortalActionError('Пациент не относится к выбранной клинике', 'NOT_FOUND');\n  }\n\n  const settings = mergeClinicSettings(clinic.settings);"""
          if old not in s:
              raise SystemExit('booking ownership anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          node -e "const fs=require('fs');const s=fs.readFileSync('dentvision-backend/src/modules/patient-portal/patientPortal.service.ts','utf8');if(!s.includes('patient.clinicId !== input.clinicId'))process.exit(1);console.log('booking ownership guard PASS')"
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dentvision-backend/src/modules/patient-portal/patientPortal.service.ts
          git commit -m 'fix: enforce booking patient clinic ownership'
          git push origin main
