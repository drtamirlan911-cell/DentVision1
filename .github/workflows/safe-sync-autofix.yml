name: Safe Sync Autofix

on:
  push:
    branches:
      - audit/safe-sync-2026-09-09

permissions:
  contents: write

jobs:
  fix-profile-syntax:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix missing Profile root closing tag
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Profile.tsx')
          s = p.read_text(encoding='utf-8-sig')
          marker = '\n }\n'
          if marker in s and '</div>\n }' not in s:
              s = s.replace(marker, '\n </div>\n }\n', 1)
              p.write_text(s, encoding='utf-8')
          else:
              raise SystemExit('Profile.tsx was not in the expected broken shape')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Profile.tsx
          git commit -m 'fix: close Profile page root element' || exit 0
          git push
