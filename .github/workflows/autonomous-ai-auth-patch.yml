name: Autonomous AI auth patch

on:
  push:
    branches:
      - autonomous/superapp-foundation-2026-09-09
    paths:
      - '.github/workflows/autonomous-ai-auth-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'drtamirlan911-cell'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autonomous/superapp-foundation-2026-09-09
          fetch-depth: 1
      - name: Harden authenticated AI session endpoints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dentvision-backend/src/modules/ai/ai.routes.ts')
          s = p.read_text()
          replacements = {
              "aiRouter.get('/history', async (req: AuthRequest, res) => {": "aiRouter.get('/history', authenticate, async (req: AuthRequest, res) => {",
              "aiRouter.post('/session', async (req: AuthRequest, res) => {": "aiRouter.post('/session', authenticate, async (req: AuthRequest, res) => {",
          }
          for old, new in replacements.items():
              if old not in s: raise SystemExit(f'missing anchor: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/autonomous-ai-auth-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dentvision-backend/src/modules/ai/ai.routes.ts .github/workflows/autonomous-ai-auth-patch.yml
          git diff --cached --check
          git commit -m "fix: require authentication for AI session history endpoints"
          git push origin autonomous/superapp-foundation-2026-09-09
