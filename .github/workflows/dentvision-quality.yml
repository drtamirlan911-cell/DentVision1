name: DentVision Quality Gate

on:
  push:
    branches: [main, 'autonomous/**']
  pull_request:
    branches: [main]

concurrency:
  group: dentvision-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web typecheck / lint / unit / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install backend dependencies for shared Vitest suite
        working-directory: dentvision-backend
        run: npm ci
      - name: Generate backend Prisma client for shared Vitest suite
        working-directory: dentvision-backend
        run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  backend:
    name: Backend typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dentvision-backend/package-lock.json
      - name: Install backend dependencies
        working-directory: dentvision-backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: dentvision-backend
        run: npx prisma generate
      - name: Build backend
        working-directory: dentvision-backend
        run: npm run build

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

  release-gate:
    name: Repository release gate
    runs-on: ubuntu-latest
    needs: [web, backend, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run quality:ci
