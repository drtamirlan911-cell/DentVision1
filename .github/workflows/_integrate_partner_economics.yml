name: One-shot Partner Economics integration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'feat: integrate partner economics BI panel') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch BI workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/bi/BIWorkspace.tsx')
          s = p.read_text()
          imp = "import PartnerEconomicsPanel from './PartnerEconomicsPanel'\n"
          if "./PartnerEconomicsPanel" not in s:
              s = s.replace("import * as api from '@/utils/api'\n", "import * as api from '@/utils/api'\n" + imp, 1)
          marker = "      {/* ═══ AI GREETING ═══ */}"
          block = "      {tab === 'platform' && isSuper && (\n        <PartnerEconomicsPanel />\n      )}\n\n"
          if "<PartnerEconomicsPanel />" not in s:
              if marker not in s:
                  raise SystemExit('BIWorkspace insertion marker not found')
              s = s.replace(marker, block + marker, 1)
          p.write_text(s)
          PY
      - name: Verify and commit
        run: |
          grep -q "PartnerEconomicsPanel" src/pages/bi/BIWorkspace.tsx
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/bi/BIWorkspace.tsx .github/workflows/_integrate_partner_economics.yml
          git rm .github/workflows/_integrate_partner_economics.yml
          git commit -m "feat: integrate partner economics BI panel"
          git push
