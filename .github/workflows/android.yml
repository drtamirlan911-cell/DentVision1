name: Android

on:
  push:
    branches: [main, develop, 'audit/**']
    paths:
      - 'android/**'
      - 'dentvision-backend/**'
      - 'src/types.ts'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'dentvision-backend/**'
      - 'src/types.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/libs.versions.toml', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Юнит-тесты
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Сборка debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Сборка preview
        run: ./gradlew --no-daemon assemblePreview

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: dentvision-preview-apk
          path: android/app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error

      - name: Выложить debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dentvision-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Отчёты тестов, если что-то упало
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
