name: Android

# Android собирается отдельно от веба намеренно.
#
# Он живёт в своём каталоге и ничего в вебе не трогает, поэтому валить общий
# пайплайн из-за него нечем — и наоборот: падение веб-тестов не должно мешать
# получить APK. По той же причине фильтр по путям: на правку React-страницы
# пятиминутную сборку Gradle запускать незачем.
#
# Ветки в фильтрах — не украшение. Без них push в ветку с открытым PR и сам PR
# запускают сборку дважды: пять с половиной минут Actions уходят на второй
# точно такой же APK. Ровно так уже устроен ci.yml, и здесь повторено то же
# правило, а не изобретено своё.
on:
  push:
    branches: [main, develop]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  # Позволяет собрать APK кнопкой, не дожидаясь коммита.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/libs.versions.toml', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Юнит-тесты
        run: ./gradlew --no-daemon testDebugUnitTest

      # Сборка, которую можно поставить на телефон: подписана отладочным
      # ключом, ходит на боевой API. Подробности — в комментарии к типу
      # `preview` в app/build.gradle.kts.
      - name: Сборка preview
        run: ./gradlew --no-daemon assemblePreview

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: dentvision-preview-apk
          path: android/app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error

      - name: Отчёты тестов, если что-то упало
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
