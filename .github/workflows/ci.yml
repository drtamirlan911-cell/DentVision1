name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint src/ --max-warnings 13

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: dentvision-backend
      - run: npx tsc --noEmit
        working-directory: dentvision-backend
      - run: npx eslint src/ --max-warnings 73
        working-directory: dentvision-backend

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate project index
        run: npm run project:index
      - name: Validate generated project index
        run: git diff --exit-code -- quality-scripts/project-index.generated.ts
      - run: npx prisma generate
      - run: npm run build --if-present
      - run: npx tsc --noEmit
      - run: npx tsx quality-scripts/command-center-audit.ts
      - name: Install backend dependencies for backend unit tests
        run: npm ci
        working-directory: dentvision-backend
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dentvision
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dentvision?connection_limit=20&pool_timeout=30
      RATE_LIMIT_API_MAX: '100000'
      RATE_LIMIT_AUTH_MAX: '100000'
      JWT_SECRET: e2e-ci-jwt-secret-not-for-production-use-only-000000
      JWT_REFRESH_SECRET: e2e-ci-refresh-secret-not-for-production-000000
      KASPI_CALLBACK_SECRET: e2e-ci-kaspi-callback-secret-not-for-prod-0000
      PLAYWRIGHT_UI_URL: http://localhost:3000
      VITE_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: dentvision-backend
      - run: npx prisma generate
        working-directory: dentvision-backend
      - name: Sync Prisma schema for the isolated E2E database
        run: npx prisma db push --skip-generate
        working-directory: dentvision-backend
      - name: Apply raw lifecycle tables required by E2E
        run: npx prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20260917_medical_lab_and_dental_lifecycle/migration.sql
        working-directory: dentvision-backend
      - run: npm run db:seed:e2e
        working-directory: dentvision-backend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start backend
        run: nohup npx tsx src/index.ts > /tmp/backend.log 2>&1 &
        working-directory: dentvision-backend
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && exit 0
            sleep 2
          done
          echo "Backend did not become healthy in time" >&2
          exit 1
      - name: Start frontend
        run: nohup npm run dev -- --host 0.0.0.0 --port 3000 > /tmp/frontend.log 2>&1 &
      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ >/dev/null && exit 0
            sleep 2
          done
          echo "Frontend did not become ready in time" >&2
          cat /tmp/frontend.log >&2 || true
          exit 1
      - name: Run E2E suite
        run: npx playwright test $(ls e2e/tests/*.spec.ts | grep -v browser-e2e | grep -v ux-coverage | grep -v business-owner-journeys | grep -v organization-owner-lifecycle)
      - name: Run browser UX coverage
        env:
          PLAYWRIGHT_UI_URL: http://localhost:3000
        run: npx playwright test e2e/tests/ux-coverage.spec.ts
      - name: Run business owner journeys
        env:
          PLAYWRIGHT_UI_URL: http://localhost:3000
        run: npx playwright test e2e/tests/business-owner-journeys.spec.ts
      - name: Run organization owner lifecycle release gate
        env:
          PLAYWRIGHT_UI_URL: http://localhost:3000
        run: npx playwright test e2e/tests/organization-owner-lifecycle.spec.ts
      - name: Install official Playwright CLI
        run: npm install --no-save --package-lock=false @playwright/cli@latest
      - name: Install Playwright agent skills
        run: npx playwright-cli install --skills=agents
      - name: Run Playwright CLI browser smoke
        env:
          PLAYWRIGHT_CLI_SESSION: dentvision-ci-smoke
        run: |
          set -euo pipefail
          mkdir -p .playwright-cli
          npx playwright-cli --version
          npx playwright-cli open 'http://localhost:3000/login?role=owner'
          npx playwright-cli fill 'input[autocomplete="username"]' 'owner-a@test.com'
          npx playwright-cli fill 'input[autocomplete="current-password"]' 'Test1234!'
          npx playwright-cli click "getByRole('button', { name: 'Войти в DentVision' })"
          npx playwright-cli snapshot --filename=.playwright-cli/ci-authenticated.yml
          test -s .playwright-cli/ci-authenticated.yml
          grep -q "DentVision" .playwright-cli/ci-authenticated.yml
          for route in \
            /ai \
            /crm/patients \
            /crm/schedule \
            /crm/dental-chart \
            /crm/treatment-plans \
            /crm/lab \
            /crm/inventory \
            /crm/cashier \
            /diagnostics \
            /diagnostics/referrals \
            /diagnostics/results \
            /diagnostics/center \
            /diagnostics/lab \
            /shop \
            /school; do
            safe_name=$(printf '%s' "$route" | tr '/-' '__')
            npx playwright-cli goto "http://localhost:3000$route"
            npx playwright-cli snapshot --filename=".playwright-cli/${safe_name}.yml"
            test -s ".playwright-cli/${safe_name}.yml"
            if grep -Eqi 'Application error|ChunkLoadError|Failed to fetch dynamically imported module|Something went wrong' ".playwright-cli/${safe_name}.yml"; then
              echo "Playwright CLI found an application error on $route" >&2
              exit 1
            fi
          done
          npx playwright-cli close
      - name: Backend log (on failure)
        if: failure()
        run: cat /tmp/backend.log
      - name: Frontend log (on failure)
        if: failure()
        run: cat /tmp/frontend.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            .playwright-cli/
          retention-days: 7
