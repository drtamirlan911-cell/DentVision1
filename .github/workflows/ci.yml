name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: dentvision-backend
      - run: npx prisma generate
        working-directory: dentvision-backend
      - run: npm run build --if-present
      - run: npx tsc --noEmit
      - run: npm test

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: dentvision-backend
      - run: npx tsc --noEmit
        working-directory: dentvision-backend
      - run: npx eslint src/ --max-warnings 72
        working-directory: dentvision-backend

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src/ --max-warnings 13

  e2e:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dentvision
      RATE_LIMIT_API_MAX: '100000'
      RATE_LIMIT_AUTH_MAX: '100000'
      JWT_SECRET: e2e-ci-jwt-secret-not-for-production-use-only-000000
      JWT_REFRESH_SECRET: e2e-ci-refresh-secret-not-for-production-000000
      KASPI_CALLBACK_SECRET: e2e-ci-kaspi-callback-secret-not-for-prod-0000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dentvision
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: dentvision-backend
      - run: npx prisma generate
        working-directory: dentvision-backend
      # Use the committed migration history instead of silently mutating the
      # test schema with --accept-data-loss. A release candidate must prove
      # that its migration path is executable, not merely that db push works.
      - run: npx prisma migrate deploy
        working-directory: dentvision-backend
      - run: npm run db:seed:e2e
        working-directory: dentvision-backend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start backend
        run: nohup npx tsx src/index.ts > /tmp/backend.log 2>&1 &
        working-directory: dentvision-backend
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && exit 0
            sleep 2
          done
          echo "Backend did not become healthy in time" >&2
          cat /tmp/backend.log >&2 || true
          exit 1
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3001
      - name: Start frontend
        run: nohup npm run preview -- --host 0.0.0.0 > /tmp/frontend.log 2>&1 &
      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173 >/dev/null && exit 0
            sleep 2
          done
          echo "Frontend did not become healthy in time" >&2
          cat /tmp/frontend.log >&2 || true
          exit 1
      # Run the complete Playwright suite, including browser-driven coverage.
      - name: Run complete E2E suite
        run: PLAYWRIGHT_BASE_URL=http://localhost:4173 npx playwright test
      - name: Backend log (on failure)
        if: failure()
        run: cat /tmp/backend.log || true
      - name: Frontend log (on failure)
        if: failure()
        run: cat /tmp/frontend.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
