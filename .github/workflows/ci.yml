name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Clean restart marker: every push supersedes the previous CI execution.
  group: dentvision-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint src/ --max-warnings 13

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: dentvision-backend
      - run: npx tsc --noEmit
        working-directory: dentvision-backend
      - run: npx eslint src/ --max-warnings 73
        working-directory: dentvision-backend

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate project index
        run: npm run project:index
      - name: Validate generated project index
        run: npx tsx quality-scripts/validate-project-index.ts
      - run: npx prisma generate
      - run: npm run build --if-present
      - run: npx tsc --noEmit
      - run: npx tsx quality-scripts/command-center-audit.ts
      - name: Install backend dependencies for backend unit tests
        run: npm ci
        working-directory: dentvision-backend
      - name: Generate system map
        run: npm run system-map --prefix dentvision-backend
      - name: Output generated system map for reconciliation
        run: cat docs/SYSTEM_MAP.md
      - name: Validate generated system map
        run: git diff --exit-code -- docs/SYSTEM_MAP.md
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dentvision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dentvision"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: development
      CORS_ORIGIN: http://127.0.0.1:3000,http://localhost:3000
      FRONTEND_URL: http://127.0.0.1:3000
      SEED_E2E_FIXTURES: 'true'
      VISUAL_EVIDENCE_DIR: e2e/visual-evidence/${{ github.run_id }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dentvision?connection_limit=20&pool_timeout=30
      RATE_LIMIT_API_MAX: '100000'
      RATE_LIMIT_AUTH_MAX: '100000'
      RATE_LIMIT_AI_MAX: '10000'
      RATE_LIMIT_GUEST_SESSION_MAX: '1000'
      JWT_SECRET: e2e-ci-jwt-secret-not-for-production-use-only-000000
      JWT_REFRESH_SECRET: e2e-ci-refresh-secret-not-for-production-000000
      # The exhaustive role/context gate can outlast the production 15-minute
      # access token. Extend only the disposable CI database session lifetime.
      JWT_EXPIRES_IN: 120m
      JWT_REFRESH_EXPIRES_IN: 24h
      KASPI_CALLBACK_SECRET: e2e-ci-kaspi-callback-secret-not-for-prod-0000
      PAYMENTS_SANDBOX: 'true'
      PLAYWRIGHT_UI_URL: http://127.0.0.1:3000
      VITE_API_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: dentvision-backend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - run: npx prisma generate
        working-directory: dentvision-backend
      - name: Sync Prisma schema for the isolated E2E database
        run: npx prisma db push --skip-generate
        working-directory: dentvision-backend
      - name: Apply raw lifecycle tables required by E2E
        run: npx prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20260917_medical_lab_and_dental_lifecycle/migration.sql
        working-directory: dentvision-backend
      - name: Apply durable AI admin queue table required by backend worker
        run: npx prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20260929130000_ai_admin_postgres_queue/migration.sql
        working-directory: dentvision-backend
      - name: Apply PostgreSQL daily counters table required by rate limiting
        run: npx prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20260929140000_postgres_daily_counters/migration.sql
        working-directory: dentvision-backend
      - name: Seed E2E fixtures
        run: npm run db:seed:e2e
        working-directory: dentvision-backend
      - name: Seed canonical IAM roles and E2E partner contexts
        run: npx tsx prisma/seed-permissions.ts
        working-directory: dentvision-backend
      - name: Start backend
        run: nohup npx tsx src/index.ts > /tmp/backend.log 2>&1 &
        working-directory: dentvision-backend
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && exit 0
            sleep 2
          done
          echo "Backend did not become healthy in time" >&2
          exit 1
      - name: Build frontend for browser gates
        run: npm run build
      - name: Start frontend
        run: nohup npm run preview -- --host 0.0.0.0 --port 3000 --strictPort > /tmp/frontend.log 2>&1 &
      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 2
          done
          echo "Frontend did not become ready in time" >&2
          cat /tmp/frontend.log >&2 || true
          exit 1
      - name: Run E2E suite
        id: e2e_core
        env:
          PLAYWRIGHT_OUTPUT_DIR: e2e/test-results/core
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/core
          E2E_GATE_LOG_PATH: e2e-core.log
        run: bash quality-scripts/run-e2e-gate.sh e2e-core npx playwright test $(ls e2e/tests/*.spec.ts | grep -v browser-e2e | grep -v ux-coverage | grep -v business-owner-journeys | grep -v organization-owner-lifecycle | grep -v mobile-design-gate | grep -v role-design-gate | grep -v visual-agent)
      - name: Checkpoint upload — core failure diagnostics
        if: ${{ always() && steps.e2e_core.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-checkpoint-core-${{ github.run_id }}
          path: |
            e2e-core.log
            e2e/test-results/core/**/error-context.md
            e2e/test-results/core/**/test-failed-*.txt
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9
      - name: Run browser UX coverage
        id: browser_ux
        # Continue after failed tests, but never run a new suite after workflow cancellation.
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_UI_URL: http://127.0.0.1:3000
          PLAYWRIGHT_OUTPUT_DIR: e2e/test-results/ux-coverage
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/ux-coverage
        run: bash quality-scripts/run-e2e-gate.sh browser-ux npx playwright test e2e/tests/ux-coverage.spec.ts
      - name: Checkpoint upload — browser-ux failure diagnostics
        if: ${{ always() && steps.browser_ux.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-checkpoint-browser-ux-${{ github.run_id }}
          path: |
            e2e-gate-logs/browser-ux.log
            e2e/test-results/ux-coverage/**/error-context.md
            e2e/test-results/ux-coverage/**/test-failed-*.txt
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9
      - name: Run mobile design release gate
        id: mobile_design_gate
        # Continue after failed tests, but never run a new suite after workflow cancellation.
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_UI_URL: http://127.0.0.1:3000
          PLAYWRIGHT_OUTPUT_DIR: e2e/test-results/mobile-design-gate
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/mobile-design-gate
        run: >-
          bash quality-scripts/run-e2e-gate.sh mobile-design-gate
          npx playwright test e2e/tests/mobile-design-gate.spec.ts
          --project=desktop-1280
          --project=laptop-1440
          --project=desktop-1920
          --project=tablet-768
          --project=tablet-820
          --project=mobile-390
          --project=mobile-412
          --project=mobile-safari
      - name: Checkpoint upload — mobile-design failure diagnostics
        if: ${{ always() && steps.mobile_design_gate.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-checkpoint-mobile-design-${{ github.run_id }}
          path: |
            e2e-gate-logs/mobile-design-gate.log
            e2e/test-results/mobile-design-gate/**/error-context.md
            e2e/test-results/mobile-design-gate/**/test-failed-*.txt
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9
      - name: Checkpoint upload — mobile visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence-mobile-${{ github.run_id }}
          path: e2e/visual-evidence/${{ github.run_id }}/responsive/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 1

      - name: Run role and context design release gate
        id: role_design_gate
        # Continue after failed tests, but never run a new suite after workflow cancellation.
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_UI_URL: http://127.0.0.1:3000
          PLAYWRIGHT_OUTPUT_DIR: e2e/test-results/role-design-gate
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/role-design-gate
        run: >-
          bash quality-scripts/run-e2e-gate.sh role-design-gate
          npx playwright test e2e/tests/role-design-gate.spec.ts
          --project=role-1280
          --project=role-desktop
          --project=role-1920
          --project=role-tablet-768
          --project=role-tablet-820
          --project=role-mobile
          --project=role-mobile-412
          --project=role-mobile-safari
      - name: Checkpoint upload — role-context failure diagnostics
        if: ${{ always() && steps.role_design_gate.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-checkpoint-role-context-${{ github.run_id }}
          path: |
            e2e-gate-logs/role-design-gate.log
            e2e/test-results/role-design-gate/**/error-context.md
            e2e/test-results/role-design-gate/**/test-failed-*.txt
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9
      - name: Checkpoint upload — role visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence-roles-${{ github.run_id }}
          path: e2e/visual-evidence/${{ github.run_id }}/roles/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 1

      - name: Run Visual Agent eyes/hands across all ecosystem roles
        id: visual_agent
        # Continue after failed tests, but never run a new suite after workflow cancellation.
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_UI_URL: http://127.0.0.1:3000
          PLAYWRIGHT_OUTPUT_DIR: e2e/test-results/visual-agent
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/visual-agent
        run: bash quality-scripts/run-e2e-gate.sh visual-agent npx playwright test e2e/tests/visual-agent.spec.ts --project=visual-agent
      - name: Checkpoint upload — visual-agent failure diagnostics
        if: ${{ always() && steps.visual_agent.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-checkpoint-visual-agent-${{ github.run_id }}
          path: |
            e2e-gate-logs/visual-agent.log
            e2e/test-results/visual-agent/**/error-context.md
            e2e/test-results/visual-agent/**/test-failed-*.txt
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9
      - name: Checkpoint upload — visual agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence-agent-${{ github.run_id }}
          path: e2e/visual-evidence/${{ github.run_id }}/visual-agent/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 1

      - name: Run business owner journeys
        id: business_owner_journeys
        # Continue after failed tests, but never run a new suite after workflow cancellation.
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_UI_URL: http://127.0.0.1:3000
          PLAYWRIGHT_OUTPUT_DIR: e2e/test-results/business-owner-journeys
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/business-owner-journeys
        run: bash quality-scripts/run-e2e-gate.sh business-owner-journeys npx playwright test e2e/tests/business-owner-journeys.spec.ts
      - name: Checkpoint upload — business-owner failure diagnostics
        if: ${{ always() && steps.business_owner_journeys.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-checkpoint-business-owner-${{ github.run_id }}
          path: |
            e2e-gate-logs/business-owner-journeys.log
            e2e/test-results/business-owner-journeys/**/error-context.md
            e2e/test-results/business-owner-journeys/**/test-failed-*.txt
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9
      - name: Run organization owner lifecycle release gate
        id: organization_owner_lifecycle
        # Continue after failed tests, but never run a new suite after workflow cancellation.
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_UI_URL: http://127.0.0.1:3000
          PLAYWRIGHT_OUTPUT_DIR: e2e/test-results/organization-owner-lifecycle
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/organization-owner-lifecycle
        run: bash quality-scripts/run-e2e-gate.sh organization-owner-lifecycle npx playwright test e2e/tests/organization-owner-lifecycle.spec.ts
      - name: Checkpoint upload — organization-owner failure diagnostics
        if: ${{ always() && steps.organization_owner_lifecycle.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-checkpoint-organization-owner-${{ github.run_id }}
          path: |
            e2e-gate-logs/organization-owner-lifecycle.log
            e2e/test-results/organization-owner-lifecycle/**/error-context.md
            e2e/test-results/organization-owner-lifecycle/**/test-failed-*.txt
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9
      - name: Install official Playwright CLI
        # Continue after failed tests, but never run a new suite after workflow cancellation.
        if: ${{ !cancelled() }}
        run: npm install --global @playwright/cli@latest
      - name: Install Playwright agent skills
        # Continue after failed tests, but never run a new suite after workflow cancellation.
        if: ${{ !cancelled() }}
        run: playwright-cli install --skills
      - name: Run Playwright CLI browser smoke
        # Continue after failed tests, but never run a new suite after workflow cancellation.
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_CLI_SESSION: dentvision-ci-smoke
        run: bash quality-scripts/run-e2e-gate.sh playwright-cli-smoke bash quality-scripts/playwright-cli-smoke.sh
      - name: Validate visual release evidence
        # Continue after failed tests, but never run a new suite after workflow cancellation.
        if: ${{ !cancelled() }}
        run: bash quality-scripts/run-e2e-gate.sh visual-release-gate npx tsx quality-scripts/visual-release-gate.ts

      - name: Generate bounded E2E artifact manifest
        if: always()
        run: |
          touch e2e-gate-timings.txt
          profile_dir() {
            label="$1"
            dir="$2"
            if [ ! -d "$dir" ]; then
              printf '%-22s files=0 bytes=0\n' "$label"
              return
            fi
            count="$(find "$dir" -type f | wc -l | tr -d '[:space:]')"
            bytes="$(find "$dir" -type f -printf '%s\n' | awk '{ sum += $1 } END { printf "%.0f", sum + 0 }')"
            printf '%-22s files=%s bytes=%s\n' "$label" "$count" "$bytes"
            find "$dir" -type f -printf '%s\t%p\n' | sort -nr | head -n 3 || true
          }
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "core_outcome=${{ steps.e2e_core.outcome }}"
            echo
            echo "=== Gate timing ==="
            cat e2e-gate-timings.txt
            echo
            echo "=== Evidence footprint (top 3 files per directory) ==="
            profile_dir responsive "e2e/visual-evidence/$GITHUB_RUN_ID/responsive"
            profile_dir roles "e2e/visual-evidence/$GITHUB_RUN_ID/roles"
            profile_dir visual-agent "e2e/visual-evidence/$GITHUB_RUN_ID/visual-agent"
            profile_dir test-results e2e/test-results
            profile_dir html-reports playwright-report
            profile_dir cli-snapshots .playwright-cli
          } > e2e-run-manifest.txt
          {
            echo "### E2E gate timing and artifact profile"
            cat e2e-run-manifest.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compact E2E failure summary
        if: always()
        run: |
          {
            echo "=== E2E gate timings ==="
            cat e2e-gate-timings.txt 2>/dev/null || true
            node quality-scripts/summarize-e2e-failures.mjs e2e-core.log e2e-gate-logs/*.log
          } > e2e-failure-summary.txt
          cat e2e-failure-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compact E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-run-diagnostics-${{ github.run_id }}
          path: |
            e2e-failure-summary.txt
            e2e-run-manifest.txt
            e2e-gate-timings.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload full E2E gate logs on failure
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-logs-${{ github.run_id }}
          path: |
            e2e-core.log
            e2e-gate-logs/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Playwright traces on failure
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: e2e/test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload focused visual failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failure-evidence-${{ github.run_id }}
          path: |
            e2e/test-results/**/test-failed-*.png
            e2e/test-results/**/error-context.md
            e2e/test-results/**/test-failed-*.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Backend log (on failure)
        if: failure()
        run: cat /tmp/backend.log
      - name: Frontend log (on failure)
        if: failure()
        run: cat /tmp/frontend.log
      - name: Upload HTML reports and CLI snapshots on failure
        uses: actions/upload-artifact@v4
        if: failure() && !cancelled()
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            playwright-report/
            .playwright-cli/
          if-no-files-found: ignore
          retention-days: 3

# CI restart marker: verify clean run
