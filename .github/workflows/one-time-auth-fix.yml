name: One-time auth production fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: use production API during session refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production API fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/store/auth.store.ts')
          s = p.read_text()
          old = "`${import.meta.env.VITE_API_URL || 'http://localhost:3001'}/api/auth/refresh`"
          new = "`${import.meta.env.VITE_API_URL || (window.location.hostname.includes('vercel.app') ? 'https://dentvision-api.onrender.com' : 'http://localhost:3001')}/api/auth/refresh`"
          if old not in s:
              raise SystemExit('expected production refresh URL expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/auth.store.ts
          git commit -m "fix: use production API during session refresh"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/one-time-auth-fix.yml || true
          git commit -m "chore: remove one-time auth fix workflow" || true
          git push || true
