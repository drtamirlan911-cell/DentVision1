name: Quality Gate
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # The root Vitest suite intentionally includes backend tests. Install and
      # generate the backend workspace first so those tests resolve their real
      # runtime dependencies and Prisma client instead of failing at import time.
      - run: npm ci
        working-directory: dentvision-backend
      - run: npm run db:generate
        working-directory: dentvision-backend
      - run: npx tsc --noEmit
      # Run all deterministic regression tests, not just static checks.
      - run: npm test -- --run
      # Locks in the current warning count (13) so it can't grow. Lower this
      # number as warnings get cleaned up over time.
      - run: npx eslint src/ --max-warnings 13
      - run: npx tsx quality-scripts/release-gate.ts
