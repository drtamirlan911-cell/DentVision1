name: Quality Gate
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      # Locks in the current warning count (13) so it can't grow — the old
      # 10000 ceiling meant "warnings allowed" in practice. Lower this number
      # as warnings get cleaned up over time.
      - run: npx eslint src/ --max-warnings 13
      - run: npx tsx quality-scripts/release-gate.ts
        continue-on-error: true
