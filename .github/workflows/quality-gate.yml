name: Quality Gate
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm ci
        working-directory: dentvision-backend
      - run: npm run db:generate
        working-directory: dentvision-backend
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npx eslint src/ --max-warnings 13
      - run: npx tsx quality-scripts/release-gate.ts
