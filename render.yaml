# DentVision — Render Blueprint
#
# ⚠️ NEVER use `prisma db push --accept-data-loss` against production.
# That flag dropped live tables on 2026-07-20.
#
# Current Render Dashboard (matches this Blueprint):
#   Build: cd dentvision-backend && npm install && npx prisma generate
#   Start: cd dentvision-backend && npx prisma migrate deploy && npx tsx src/index.ts

services:
  - type: web
    name: dentvision-api
    runtime: node
    plan: free
    buildCommand: cd dentvision-backend && npm install && npx prisma generate && npx prisma migrate deploy && npx tsx prisma/seed-permissions.ts && npx tsx prisma/migrate-unified-schema.ts
    startCommand: cd dentvision-backend && npx tsx src/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        # Production + localhost. Preview hosts matching dent-vision* / dentvision* are always allowed in code.
        value: "https://dent-vision1.vercel.app,http://localhost:5173"
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_API_URL
        value: "https://dentvision-api.onrender.com"
      - key: FRONTEND_URL
        value: "https://dent-vision1.vercel.app"
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: KASPI_CALLBACK_SECRET
        sync: false
      # Transactional email (password reset, patient portal links).
      # SMTP_PASSWORD must be a Google App Password for this account — Google
      # refuses account passwords for SMTP, and App Passwords require 2-Step
      # Verification to be enabled first. Set it in the Render dashboard.
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        value: "dentvision.kz@gmail.com"
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: "DentVision <dentvision.kz@gmail.com>"
      # Google sign-in. Public value — the same string goes to Vercel as
      # VITE_GOOGLE_CLIENT_ID. No client secret: the ID-token flow does not use
      # one. Create it in Google Cloud Console → Credentials → OAuth client ID
      # (type: Web), listing both app origins under Authorized JavaScript
      # origins.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Optional Redis (BullMQ ai-admin worker + EventBus streams).
      # Unset (default) → in-memory fallbacks; worker/queue skipped.
      # Set to an Upstash (or any TLS `rediss://`) connection string in the
      # Render dashboard — sync:false means Render prompts for the value
      # instead of it living in this file.
      - key: REDIS_URL
        sync: false
      # Only needed if REDIS_URL points at localhost/127.0.0.1 (e.g. a sidecar
      # on the same instance) — a remote Upstash URL doesn't need this.
      # - key: REDIS_ENABLED
      #   value: "true"
