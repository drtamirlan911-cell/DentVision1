# DentVision — Render Blueprint
#
# ⚠️ NEVER use `prisma db push --accept-data-loss` against production.
# That flag dropped live tables on 2026-07-20.
#
# Current Render Dashboard (matches this Blueprint):
#   Build: cd dentvision-backend && npm install && npx prisma generate
#   Start: cd dentvision-backend && npx prisma migrate deploy && npx tsx src/index.ts

services:
  - type: web
    name: dentvision-api
    runtime: node
    plan: free
    buildCommand: cd dentvision-backend && npm install && npx prisma generate && npx prisma migrate deploy && npx tsx prisma/seed-permissions.ts && npx tsx prisma/migrate-unified-schema.ts
    startCommand: cd dentvision-backend && npx tsx src/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        # Production + localhost. Preview hosts matching dent-vision* / dentvision* are always allowed in code.
        value: "https://dent-vision1.vercel.app,http://localhost:5173"
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_API_URL
        value: "https://dentvision-api.onrender.com"
      - key: FRONTEND_URL
        value: "https://dent-vision1.vercel.app"
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: KASPI_CALLBACK_SECRET
        sync: false
      # Optional Redis (BullMQ ai-admin worker + EventBus streams).
      # Unset (default) → in-memory fallbacks; worker/queue skipped.
      # - key: REDIS_URL
      #   value: "redis://default:<password>@<host>:6379"
      # - key: REDIS_ENABLED
      #   value: "true"
